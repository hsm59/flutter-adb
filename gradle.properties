# Android Studio release to compile against and launch with runIde.
# Gradle downloads it automatically, so no local install path is needed.
studioVersion=2026.1.3.8
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g -Djava.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Stack=true